buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'com.android.application'
}

dependencies {
    implementation "androidx.core:core:1.19.0"
    implementation "androidx.legacy:legacy-support-core-utils:1.0.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.annotation:annotation:1.9.0"
    implementation "org.mozilla.geckoview:geckoview:154.0.20260824154132"
    implementation "cz.msebera.android:httpclient:4.5.8"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

android {
    namespace 'com.sergebakharev.hnplus'
    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    compileSdk 37
    buildFeatures {
        viewBinding true
    }
    defaultConfig {
        applicationId "com.sergebakharev.hnplus"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "0.1.12"
    }
    signingConfigs {
        def props = new Properties()
        if (rootProject.file("release.properties").exists()) {
            props.load(new FileInputStream(rootProject.file("release.properties")))
        }
        release {
            storeFile props.keyStore ? new File(rootProject.projectDir, props.keyStore.toString()) : null
            storePassword props.keyStorePassword ?: ""
            keyAlias props.keyAlias ?: ""
            keyPassword props.keyAliasPassword ?: ""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            debuggable false
            shrinkResources false
        }
        debug {
        }
    }
}

// Task to copy NOTICE file to assets
task copyNoticeFile(type: Copy) {
    from rootProject.file('NOTICE')
    into file('src/main/assets')
    rename { String fileName ->
        'NOTICE'
    }
}

// Make sure the copy task runs before the build
preBuild.dependsOn copyNoticeFile

repositories {
    mavenCentral()
    maven {
        url "https://maven.mozilla.org/maven2/"
    }
}
